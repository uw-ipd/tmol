[project]
name = "tmol"
description = "GPU-accelerated PyTorch reimplementation of the Rosetta energy function"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    { name = "Institute for Protein Design", email = "contact@ipd.uw.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
version = "0.1.62"

dependencies = [
    # Core ML framework.
    # 2.8 is the oldest torch any published wheel is built for (see
    # scripts/release_matrix.py); nothing below it is built or tested.
    # A wheel is additionally bound to the exact minor it was compiled
    # against -- that pairing is carried in the local version tag
    # (+cu130torch2.13). Select that variant through its wheel index.
    "torch>=2.8",
    "numpy>=1.25",
    "scipy>=1.13.1",
    # Data structures & serialization
    "attrs>=21.0",
    "attrs_strict>=1.0,<2",
    "cattrs>=22.0",
    "frozendict>=2.4",
    "pandas>=2.2,<4",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0",
    # Graphs & algorithms
    "networkx>=3.0",
    # Utilities
    "toolz>=0.12.0,<2",
    # decorator floor kept low (>=4.0) for Google Colab, which ships an old version
    "decorator>=4.0",
    "typing_extensions>=4.0,<5",
    "typing_inspect>=0.9",
    "pint>=0.23,<1",
    "psutil>=5.9",
    "requests>=2.33,<3",
    # Sparse arrays (requires SPARSE_AUTO_DENSIFY=1 for sparse>0.3.1)
    "sparse>=0.13",
    # numba/llvmlite
    "numba>=0.56",
    "llvmlite>=0.39",
    # Testing (hypothesis is used at runtime for property-based data generation)
    "hypothesis>=5.35",
    # AST manipulation for runtime call-argument validation
    "astor>=0.8",
    # Structure I/O
    "biotite==1.6.0",
    # AtomWorks 3 uses Biotite 1.6.0.
    "atomworks>=3.0.0,<4",
    # Ligand preparation
    "rdkit>=2024.3.5",
    "openbabel-wheel>=3.1.1.23,<4",
]

[project.optional-dependencies]
dev = [
    # Linters & formatters
    # Keep formatter and linter pins in sync with .pre-commit-config.yaml.
    "black==26.10.0",
    "flake8==7.4.1",
    "pre-commit>=4.0",
    "clang-format==23.1.2",
    # Testing
    "build>=1.2",  # Build real sdists in the packaging regression tests.
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-benchmark>=5.1",
    "pytest-forked>=1.6",
    "pytest-instafail>=0.5",
    "pytest-repeat>=0.9",
    "pytest-watch>=4.2",
    "pytest-xdist>=3.6",
    # Interactive
    "ipython>=8.0",
    # Visualization
    "seaborn>=0.13",
]
cuda = [
    # CUDA nvcc compiler for JIT compilation of custom kernels.
    # Only the unsuffixed (cu13) package ships the full nvcc binary;
    # nvidia-cuda-nvcc-cu12 only contains ptxas.
    "nvidia-cuda-nvcc>=13",
    # CCCL headers (nv/target, cub/, thrust/) needed by nvcc
    "nvidia-cuda-cccl>=13",
]
docs = [
    "sphinx>=8.0,<10",
    "pydata-sphinx-theme>=0.16,<1",
    "myst-parser>=4.0,<6",
    "nbsphinx>=0.9,<1",
    "sphinx-togglebutton>=0.3,<1",
    "matplotlib>=3.8,<4",
    "pypandoc-binary>=1.15,<2",
    "linkify-it-py>=2.0,<3",
    "ipython>=8.0",
    "py3Dmol>=2.4,<3",
    "itables>=2.0",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "ipykernel>=6.29,<8",
]

[project.urls]
Documentation = "https://uw-ipd.github.io/tmol/"
Issues = "https://github.com/uw-ipd/tmol/issues"
Repository = "https://github.com/uw-ipd/tmol"
Releases = "https://github.com/uw-ipd/tmol/releases"

# Build settings ---------------------------------------------------------------
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "torch>=2.8",
    "pybind11>=2.12",
    "ninja",
    "packaging",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = ">=3.24,<4"
wheel.packages = ["tmol"]
wheel.install-dir = "."
wheel.exclude = ["tmol/tests/**"]
sdist.cmake = false
editable.mode = "inplace"

[tool.scikit-build.cmake.define]
CMAKE_CUDA_ARCHITECTURES = {env = "CMAKE_CUDA_ARCHITECTURES", default = "native"}
TMOL_BUILD_TESTS = {env = "TMOL_BUILD_TESTS", default = "OFF"}

[tool.cibuildwheel]
build = "cp3{11,12,13,14}-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"

# Test settings ----------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--benchmark-disable --benchmark-columns=ops,mean,iqr -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:(?s).*is not compatible with the compiler Pytorch.*:",
    "ignore:(?s).*Benchmark fixture was not used.*:",
    "ignore:(?s).*one of the inputs that requires gradient is not of double precision.*:",
    "ignore:(?s).*Distutils was imported before Setuptools*:",
    "ignore:(?s).*To copy construct from a tensor, it is recommended to use*:",
    "ignore:(?s).*pkg_resources is deprecated*:",
    "ignore:(?s).*Deprecated call to `pkg_resources.declare_namespace*:",
]

[tool.pytest-watch]
ext = ".cpp,.hh,.h,.cu,.py,.yaml"

# Coverage settings ------------------------------------------------------------
# Vendored third-party ports are excluded from coverage measurement: driving
# them to a coverage target via unit tests is not meaningful. Keep this list in
# sync with the `ignore:` block in codecov.yml.
[tool.coverage.run]
omit = [
    "*/tmol/ligand/_openbabel_compat.py",
    "*/tmol/tests/ligand/_build_pli_ligand_cifs.py",
]

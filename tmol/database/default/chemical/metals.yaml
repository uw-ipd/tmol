# Metal coordination reference data.
#
# Distances are median metal-ligand separations measured from annotated
#    coordination in high-resolution PDB entries; only cells with enough
#    observations are listed. Anything absent is filled by the generator as
#    ionic_radius + donor_radius, so this file states what was measured and
#    nothing else.
# Geometry vertices are unit vectors; a geometry with none is untemplated,
#    meaning metal-ligand distances are restrained but site geometry is not.
# Each ion's geometries are listed most-common first, from observed
#    coordination numbers in high-resolution entries; the first is the
#    default when nothing else decides. Those counts include waters, which
#    structure input drops, so detection will usually see fewer donors than
#    the geometry has sites -- the list is what supplies the rest.

donor_radii:
  O: 1.396
  N: 1.353
  S: 1.549
  Owat: 1.404

geometries:
  - name: linear
    vertices:
    - [ 0.000000,  0.000000,  1.000000]
    - [ 0.000000,  0.000000, -1.000000]
  - name: trigonal
    vertices:
    - [ 1.000000,  0.000000,  0.000000]
    - [-0.500000,  0.866025,  0.000000]
    - [-0.500000, -0.866025,  0.000000]
  - name: tetrahedral
    vertices:
    - [ 0.577350,  0.577350,  0.577350]
    - [ 0.577350, -0.577350, -0.577350]
    - [-0.577350,  0.577350, -0.577350]
    - [-0.577350, -0.577350,  0.577350]
  - name: square_planar
    vertices:
    - [ 1.000000,  0.000000,  0.000000]
    - [ 0.000000,  1.000000,  0.000000]
    - [-1.000000,  0.000000,  0.000000]
    - [ 0.000000, -1.000000,  0.000000]
  - name: square_pyramidal
    vertices:
    - [ 0.000000,  0.000000,  1.000000]
    - [ 1.000000,  0.000000,  0.000000]
    - [ 0.000000,  1.000000,  0.000000]
    - [-1.000000,  0.000000,  0.000000]
    - [ 0.000000, -1.000000,  0.000000]
  - name: trigonal_bipyramidal
    vertices:
    - [ 0.000000,  0.000000,  1.000000]
    - [ 1.000000,  0.000000,  0.000000]
    - [-0.500000,  0.866025,  0.000000]
    - [-0.500000, -0.866025,  0.000000]
    - [ 0.000000,  0.000000, -1.000000]
  - name: octahedral
    vertices:
    - [ 1.000000,  0.000000,  0.000000]
    - [ 0.000000,  1.000000,  0.000000]
    - [ 0.000000,  0.000000,  1.000000]
    - [-1.000000,  0.000000,  0.000000]
    - [ 0.000000, -1.000000,  0.000000]
    - [ 0.000000,  0.000000, -1.000000]
  - name: irregular
    vertices: []

ions:
  - element: Mg
    oxidation_state: 2
    atom_type: Mg2p
    name3: MG
    ionic_radius: 0.72
    geometries: [octahedral]
    distances: { O: 2.073, Owat: 2.086 }
  - element: Ca
    oxidation_state: 2
    atom_type: Ca2p
    name3: CA
    ionic_radius: 1.0
    geometries: [irregular]
    distances: { O: 2.335, Owat: 2.396 }
  - element: Na
    oxidation_state: 1
    atom_type: Na1p
    name3: NA

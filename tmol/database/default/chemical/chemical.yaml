element_types:
  - {name: H, atomic_number: 1}
  - {name: C, atomic_number: 6}
  - {name: N, atomic_number: 7}
  - {name: O, atomic_number: 8}
  - {name: F, atomic_number: 9}
  - {name: Na, atomic_number: 11}
  - {name: P, atomic_number: 15}
  - {name: S, atomic_number: 16}
  - {name: Cl, atomic_number: 17}
  - {name: K, atomic_number: 19}
  - {name: Br, atomic_number: 35}
  - {name: I, atomic_number: 53}
  - {name: Vr, atomic_number: 0}

atom_types:
  - name: CNH2
    element: C
    is_acceptor: False
    acceptor_hybridization: null
    is_donor: False
    is_hydroxyl: False
    is_polarh: False
  - { name: COO , element: C }
  - { name: CH0 , element: C }
  - { name: CH1 , element: C }
  - { name: CH2 , element: C }
  - { name: CH3 , element: C }
  - { name: Caro, element: C }

  - { name: Ntrp, element: N, is_donor : true } #Tryp indole or pyrrole

  - { name: NhisE,      element: N, is_donor : true } #Far in His imidazole
  - { name: NhisEDepro, element: N, is_acceptor: true, acceptor_hybridization: ring } # Deprotenated form in HIS
  - { name: NhisD,      element: N, is_donor : true }  #Near in His imidazole
  - { name: NhisDDepro, element: N, is_acceptor: true, acceptor_hybridization: ring } # Deprotenated form in HIS_D

  - { name: NtrR, element: N, is_donor : true }
  - { name: NH2O, element: N, is_donor : true }
  - { name: Nlys, element: N, is_donor : true }
  - { name: Narg, element: N, is_donor : true }
  - { name: Npro, element: N, is_donor : true } # should not be a donor, but matching rosetta

  - { name: OH      , element: O, is_donor : true, is_acceptor : true, acceptor_hybridization: sp3, is_hydroxyl : true }
  - { name: OHphenol, element: O, is_donor : true, is_acceptor : true, acceptor_hybridization: sp3, is_hydroxyl : true } # Phenol hydrogen in TYR

  - { name: Owat, element: O, is_donor: true, is_acceptor : true , acceptor_hybridization: sp3 }
  - { name: ONH2, element: O, is_acceptor : true, acceptor_hybridization: sp2 }
  - { name: OOC , element: O, is_acceptor : true, acceptor_hybridization: sp2 }

  - { name: S   , element: S }
  - { name: SH1 , element: S }

  - { name: Nbb , element: N, is_donor : true }
  - { name: CAbb, element: C }
  - { name: CObb, element: C }
  - { name: OCbb, element: O, is_acceptor : true, acceptor_hybridization: sp2 }

  - { name: Hapo, element: H }
  - { name: Haro, element: H }

  - { name: Hpol, element: H, is_polarh : true }
  - { name: HS  , element: H } # not polar in rosetta
  - { name: HNbb, element: H, is_polarh : true }
  - { name: Hwat, element: H, is_polarh : true }
  - { name: Vrt, element: Vr}

  # DNA atom types. Rosetta shares Ntrp/Nhis/NH2O/Npro between protein and DNA;
  # tmol splits them so the DNA-specific LK values do not perturb protein scores.
  - { name: Pdna, element: P }
  - { name: OOP , element: O, is_acceptor : true, acceptor_hybridization: sp2 } # phosphate OP1/OP2
  - { name: Oet2, element: O, is_acceptor : true, acceptor_hybridization: sp2 } # phosphate ester O5'/O3'
  - { name: Oet3, element: O, is_acceptor : true, acceptor_hybridization: sp3, is_donor : true } # ribose ring O4'; should not be a donor, but matching rosetta
  - { name: Obacc   , element: O, is_acceptor : true, acceptor_hybridization: sp2 } # pyrimidine O2/O4
  - { name: ObaccG, element: O, is_acceptor : true, acceptor_hybridization: sp2 } # guanine O6; hbacc_CXL where Obacc is hbacc_CXA
  - { name: Nglyc, element: N, is_donor : true } # glycosidic N9/N1; should not be a donor, but matching rosetta
  - { name: Nbacc, element: N, is_acceptor : true, acceptor_hybridization: ring } # base ring acceptors
  - { name: Nbamn, element: N, is_donor : true } # exocyclic amines N6/N4/N2
  - { name: Nbdon, element: N, is_donor : true } # protonated ring N: GUA N1, THY N3

  # Generic potential atom types for ligands (from Rosetta generic_potential)
  # Carbon
  - { name: CD  , element: C }
  - { name: CD1 , element: C }
  - { name: CD2 , element: C }
  - { name: CDp , element: C }
  - { name: CR  , element: C }
  - { name: CRp , element: C }
  - { name: CS  , element: C }
  - { name: CS1 , element: C }
  - { name: CS2 , element: C }
  - { name: CS3 , element: C }
  - { name: CSp , element: C }
  - { name: CSQ , element: C }
  - { name: CT  , element: C }
  - { name: CTp , element: C }
  # Hydrogen
  - { name: HC  , element: H }
  - { name: HN  , element: H, is_polarh: true }
  - { name: HO  , element: H, is_polarh: true }
  - { name: HR  , element: H }
  - { name: HG  , element: H, is_polarh: true }
  # Nitrogen
  - { name: Nad , element: N, is_donor: true }
  - { name: Nad3, element: N }
  - { name: Nam , element: N, is_donor: true }
  - { name: Nam2, element: N, is_donor: true }
  - { name: Ngu1, element: N, is_donor: true }
  - { name: Ngu2, element: N, is_donor: true }
  - { name: Nim , element: N, is_acceptor: true, acceptor_hybridization: ring }
  - { name: Nin , element: N, is_donor: true }
  - { name: NG1 , element: N }
  - { name: NG2 , element: N }
  - { name: NG21, element: N, is_donor: true }
  - { name: NG22, element: N, is_donor: true }
  - { name: NG3 , element: N }
  # Oxygen
  - { name: Oad , element: O, is_acceptor: true, acceptor_hybridization: sp2 }
  - { name: Oal , element: O, is_acceptor: true, acceptor_hybridization: sp2 }
  - { name: Oat , element: O, is_acceptor: true, acceptor_hybridization: sp2 }
  - { name: Oet , element: O } # fd: this should be an acceptor, leaving as-is to match Rosetta
  - { name: Ofu , element: O }
  - { name: Ohx , element: O, is_donor: true, is_acceptor: true, acceptor_hybridization: sp3 } # fd: is_hydroxyl should be true but false to match Rosetta
  - { name: Ont , element: O }
  - { name: OG2 , element: O, is_acceptor: true, acceptor_hybridization: sp2 }
  - { name: OG3 , element: O, is_acceptor: true, acceptor_hybridization: sp3 }
  - { name: OG31, element: O, is_acceptor: true, acceptor_hybridization: sp3 }
  # Sulfur
  - { name: SR  , element: S }
  - { name: Ssl , element: S }
  - { name: Sth , element: S }
  - { name: SG2 , element: S }
  - { name: SG3 , element: S }
  - { name: SG5 , element: S }
  # Phosphorus
  - { name: PG3 , element: P }
  - { name: PG5 , element: P }
  - { name: Phos, element: P }
  # Halogens
  - { name: F   , element: F, acceptor_hybridization: sp3 }
  - { name: Cl  , element: Cl, acceptor_hybridization: sp3 }
  - { name: Br  , element: Br, acceptor_hybridization: sp3 }
  - { name: I   , element: I, acceptor_hybridization: sp3 }
  - { name: FR  , element: F }
  - { name: ClR , element: Cl }
  - { name: BrR , element: Br }
  - { name: IR  , element: I }

residues:
  - name:  ALA
    base_name: ALA
    name3: ALA
    io_equiv_class: ALA
    one_letter_code: A
    atoms:
    - { name: N   ,  atom_type: Nbb  }
    - { name: CA  ,  atom_type: CAbb }
    - { name: C   ,  atom_type: CObb }
    - { name: O   ,  atom_type: OCbb }
    - { name: CB  ,  atom_type: CH3  }
    - { name: H   ,  atom_type: HNbb }
    - { name: HA  ,  atom_type: Hapo }
    - { name: HB1 ,  atom_type: Hapo }
    - { name: HB2 ,  atom_type: Hapo }
    - { name: HB3 ,  atom_type: Hapo }
    atom_aliases:
    - { name: HB1 , alt_name: 1HB }
    - { name: HB2 , alt_name: 2HB }
    - { name: HB3 , alt_name: 3HB }
    bonds:
    - [   N,   CA, SINGLE, false]
    - [   N,    H, SINGLE, false]
    - [  CA,    C, SINGLE, false]
    - [   C,    O, DOUBLE, false]
    - [  CA,   CB, SINGLE, false]
    - [  CA,   HA, SINGLE, false]
    - [  CB,  HB1, SINGLE, false]
    - [  CB,  HB2, SINGLE, false]
    - [  CB,  HB3, SINGLE, false]
    connections:
    - { name: down, atom: N, type: AROMATIC }
    - { name: up, atom: C, type: AROMATIC }
    torsions:
    - name: phi
      a: { connection: down, bond_sep_from_conn: 0 }
      b: { atom: N }
      c: { atom: CA }
      d: { atom: C }
    - name: psi
      a: { atom: N }
      b: { atom: CA }
      c: { atom: C }
      d: { connection: up, bond_sep_from_conn: 0 }
    - name: omega
      a: { atom: CA }
      b: { atom: C }

variants:
  - name:  CarboxyTerminus
    display_name: cterm
    pattern: '[*][*]C(=O)[{up}]'
    applies_to: { backbone_types: [alpha] }
    remove_atoms:
    - <{up}>
    - <O1>
    add_atoms:
    - { name: O    ,  atom_type: OOC }
    - { name: OXT  ,  atom_type: OOC }
    add_atom_aliases: []
    modify_atoms: []
    add_connections: []
    add_bonds:
    - [   <C1>,    OXT, AROMATIC, false ]
    - [   <C1>,    O  , AROMATIC, false ]
    icoors:
    - { name:     O, source: <O1>, phi:   80.0 deg, theta: 60.0 deg, d: 1.2, parent:  <C1>, grand_parent: <*2>, great_grand_parent: <*1>}
    - { name:   OXT, source: <O1>, phi: -180.0 deg, theta: 60.0 deg, d: 1.2, parent:  <C1>, grand_parent: <*2>, great_grand_parent: O }

  - name:  AminoTerminus
    display_name: nterm
    pattern: '[*][*][NH][{down}]'
    applies_to: { backbone_types: [alpha] }
    remove_atoms:
    - <{down}>
    - <H1>
    add_atoms:
    - { name: H1  ,  atom_type: Hpol }
    - { name: H2  ,  atom_type: Hpol }
    - { name: H3  ,  atom_type: Hpol }
    add_atom_aliases:
    - { name: H1  ,  alt_name: 1H }
    - { name: H2  ,  alt_name: 2H }
    - { name: H3  ,  alt_name: 3H }

    modify_atoms:
    - { name: <N1> ,  atom_type: Nlys }
    add_connections: []
    add_bonds:
    - [  <N1>,    H1  , SINGLE, false ]
    - [  <N1>,    H2  , SINGLE, false ]
    - [  <N1>,    H3  , SINGLE, false ]
    icoors:
    - { name:   H1, source: <H1>, phi: 180.0 deg, theta: 70.5 deg, d: 1.0, parent:  <N1>, grand_parent: <*2>, great_grand_parent: <*1> }
    - { name:   H2, source: <H1>, phi: 120.0 deg, theta: 70.5 deg, d: 1.0, parent:  <N1>, grand_parent: <*2>, great_grand_parent: H1 }
    - { name:   H3, source: <H1>, phi: 120.0 deg, theta: 70.5 deg, d: 1.0, parent:  <N1>, grand_parent: <*2>, great_grand_parent: H2 }

  - name:  AminoTerminusPro
    display_name: nterm
    pattern: 'CN(C)[{down}]'
    applies_to: { backbone_types: [alpha] }
    remove_atoms:
    - <{down}>
    add_atoms:
    - { name: H2  ,  atom_type: Hpol }
    - { name: H3  ,  atom_type: Hpol }
    add_atom_aliases:
    - { name: H2  ,  alt_name: 1H }
    - { name: H3  ,  alt_name: 2H }
    modify_atoms: []
    add_connections: []
    add_bonds:
    - [  <N1>,    H2 , SINGLE, false ]
    - [  <N1>,    H3 , SINGLE, false ]
    icoors:
    - { name:   H2, phi:  120.0 deg, theta:   70.5 deg, d: 1.0, parent: <N1>, grand_parent: <C1>, great_grand_parent: <C2>}
    - { name:   H3, phi: -120.0 deg, theta:   70.5 deg, d: 1.0, parent: <N1>, grand_parent: <C1>, great_grand_parent: <C2>}

  # 5' terminus with the phosphate retained
  - name:  NaFivePrimePhosphate
    display_name: na5primephos
    pattern: '[{down}]P(O)(O)OCC'
    applies_to: { backbone_types: [dna, rna] }
    remove_atoms:
    - <{down}>
    - <O1>
    - <O2>
    add_atoms:
    - { name: OP3 ,   atom_type: OOP }
    - { name: OP2 ,   atom_type: OOP }
    - { name: OP1 ,   atom_type: OOP }
    add_atom_aliases:
    - { name: OP3 ,  alt_name: O3P  }
    modify_atoms: []
    add_connections: []
    add_bonds:
    - [  <P1>,   OP3, SINGLE, false ]
    - [  <P1>,   OP2, SINGLE, false ]
    - [  <P1>,   OP1, SINGLE, false ]
    # OP1/OP2 rebuilt because icoor depended on down
    icoors:
    - { name: OP3, phi:  -60.259000 deg, theta: 76.024713 deg, d: 1.607355, parent: <P1>, grand_parent: <O3>, great_grand_parent: <C1> }
    - { name: OP2, phi: -114.264473 deg, theta: 71.902412 deg, d: 1.485499, parent: <P1>, grand_parent: <O3>, great_grand_parent: OP3 }
    - { name: OP1, phi: -130.879776 deg, theta: 71.671829 deg, d: 1.484918, parent: <P1>, grand_parent: <O3>, great_grand_parent: OP2 }

  # 5' terminus with the phosphate absent
  - name:  NaFivePrime
    display_name: na5prime
    pattern: '[{down}]P(O)(O)OCC'
    applies_to: { backbone_types: [dna, rna] }
    remove_atoms:
    - <{down}>
    - <P1>
    - <O1>
    - <O2>
    add_atoms:
    - { name: HO5' ,  atom_type: Hpol }
    add_atom_aliases: []
    modify_atoms: []
    add_connections: []
    add_bonds:
    - [  <O3>,   HO5', SINGLE, false ]
    icoors:
    - { name: HO5', phi: 179.890442 deg, theta: 70.479956 deg, d: 1.000437, parent: <O3>, grand_parent: <C1>, great_grand_parent: <C2> }
    add_torsions:
    - {name: chi3, a: {atom: <C2>}, b: {atom: <C1>}, c: {atom: <O3>}, d: {atom: HO5'}}
    add_chi_samples:
    - chi_dihedral: chi3
      samples: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280, 300, 320, 340]
      expansions: []

  # DNA 3' terminus. The pattern pins C4' as O4'-C4'-C3'-O3'
  - name:  NaThreePrime
    display_name: na3prime
    pattern: 'COCCO[{up}]'
    applies_to: { backbone_types: [dna, rna] }
    remove_atoms:
    - <{up}>
    add_atoms:
    - { name: HO3' ,  atom_type: Hpol }
    add_atom_aliases: []
    modify_atoms: []
    add_connections: []
    add_bonds:
    - [  <O2>,   HO3', SINGLE, false ]
    icoors:
    - { name: HO3', phi: 180.0 deg, theta: 70.479956 deg, d: 1.000437, parent: <O2>, grand_parent: <C3>, great_grand_parent: <C2> }
    add_torsions:
    - {name: chi4, a: {atom: <C2>}, b: {atom: <C3>}, c: {atom: <O2>}, d: {atom: HO3'}}
    add_chi_samples:
    - chi_dihedral: chi4
      samples: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280, 300, 320, 340]
      expansions: []

# Per filled site: ((r - d0) / radial_sd)^2 + (off_ray / lateral_sd)^2 + well depth, d0 from
#    chemical/metals.yaml; fans are held at ideal separations with fan_sd.

global_parameters:
  radial_sd: 0.20
  lateral_sd: 0.40
  fan_sd: 0.05
  bridge_width: 6.0

# per-ion width overrides, keyed by the metal's atom type:
#   - { atom_type: Zn2p, radial_sd: 0.15, lateral_sd: 0.30 }
ions: []

# well depth (kcal/mol) per filled site by metal atom type and donor_radii key; absent is 0
#   - { atom_type: Zn2p, donor: S, depth: -10.0 }
well_depths: []

# smallest metal-donor-metal angle (deg) per donor_radii key: bridged metals get a wall,
#    bridge_width (deg) wide, below the separation at ideal distances; none: no wall
bridge_floors:
  - { donor: S, floor: 63.0 }
  - { donor: O, floor: 68.0 }
  - { donor: Owat, floor: 68.0 }
  - { donor: N, floor: 68.0 }
  - { donor: F, floor: 95.0 }

    resolution: 0.43
    # CCD FE is Fe(III)
    metals:
      - {chain: A, res: 101, comp: FE, geometry: tetrahedral, n_open_sites: 0}
    donors:
      A/FE/101:
        - {chain: A, res: 6, comp: CYS, atom: SG, dist: 2.298}
        - {chain: A, res: 9, comp: CYS, atom: SG, dist: 2.270}
        - {chain: A, res: 39, comp: CYS, atom: SG, dist: 2.339}
        - {chain: A, res: 42, comp: CYS, atom: SG, dist: 2.278}
    site_waters: {}

  cu_zn_sod_3f7l:
    pdb: 3F7L
    resolution: 0.99
    # Edited input: the deposited copper has two alternates, CU1 201 (altloc A,
    # 0.8) and CU 202 (altloc B, 0.2), each its own residue, and the reader
    # keeps both. CU 202 was deleted and CU1 201 set to occupancy 1.00.
    metals:
      - {chain: A, res: 201, comp: CU1, geometry: trigonal, n_open_sites: 0}
      - {chain: A, res: 203, comp: ZN, geometry: tetrahedral, n_open_sites: 0}
    donors:
      A/CU1/201:
        - {chain: A, res: 44, comp: HIS, atom: ND1, dist: 1.991}
        - {chain: A, res: 46, comp: HIS, atom: NE2, dist: 1.930}

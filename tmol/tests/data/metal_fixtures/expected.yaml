# Expected metal coordination for the fixtures in this directory.
#
# Residues are named by author chain, author residue number and component id.
# Donors are what detection should find once crystallographic waters are
# stripped, which is the normal structure-input path. Distances are from the
# deposited coordinates.
#
# site_waters are the waters the deposited model coordinates to the metal.
# They are reference data for placing open-site waters, not detection targets.
#
# geometry null means untemplated. A cluster names its block_type instead. xfail
# names why a fixture cannot load yet.

fixtures:
  zn_tetrahedral_3ks3:
    pdb: 3KS3
    resolution: 0.90
    metals:
      - {chain: A, res: 262, comp: ZN, geometry: tetrahedral, n_open_sites: 1}
    donors:
      A/ZN/262:
        - {chain: A, res: 94, comp: HIS, atom: NE2, dist: 2.027}
        - {chain: A, res: 96, comp: HIS, atom: NE2, dist: 2.038}
        - {chain: A, res: 119, comp: HIS, atom: ND1, dist: 2.023}
    site_waters:
      A/ZN/262:
        - {res: 402, dist: 1.900}
        - {res: 707, dist: 2.569}


# Expected metal coordination for the fixtures in this directory.
#
# Residues are named by author chain, author residue number and component id.
# Donors are what detection should find once crystallographic waters are
# stripped, which is the normal structure-input path. Distances are from the
# deposited coordinates.
#
# site_waters are the waters the deposited model coordinates to the metal.
# They are reference data for placing open-site waters, not detection targets.
#
# geometry null means untemplated. xfail names why a fixture cannot load yet.

fixtures:
  zn_tetrahedral_3ks3:
    pdb: 3KS3
    resolution: 0.90
    metals:
      - {chain: A, res: 262, comp: ZN, geometry: tetrahedral, n_open_sites: 1}
    donors:
      A/ZN/262:
        - {chain: A, res: 94, comp: HIS, atom: NE2, dist: 2.027}
        - {chain: A, res: 96, comp: HIS, atom: NE2, dist: 2.038}
        - {chain: A, res: 119, comp: HIS, atom: ND1, dist: 2.023}
    site_waters:
      A/ZN/262:
        - {res: 402, dist: 1.900}
        - {res: 707, dist: 2.569}

  ca_irregular_2fvy:
    pdb: 2FVY
    resolution: 0.92
    metals:
      - {chain: A, res: 311, comp: CA, geometry: null}
    donors:
      A/CA/311:
        - {chain: A, res: 134, comp: ASP, atom: OD1, dist: 2.284}
        - {chain: A, res: 136, comp: ASN, atom: OD1, dist: 2.384}
        - {chain: A, res: 138, comp: ASP, atom: OD2, dist: 2.397}
        - {chain: A, res: 140, comp: GLN, atom: O, dist: 2.348}
        - {chain: A, res: 142, comp: GLN, atom: OE1, dist: 2.309}
        - {chain: A, res: 205, comp: GLU, atom: OE1, dist: 2.480}
        - {chain: A, res: 205, comp: GLU, atom: OE2, dist: 2.485}
    site_waters: {}

  sf4_ferredoxin_2fdn:
    pdb: 2FDN
    resolution: 0.94
    xfail: SF4 is a metal-containing cofactor; needs an authored block type
    metals:
      - {chain: A, res: 61, comp: SF4}
      - {chain: A, res: 62, comp: SF4}
    donors:
      A/SF4/61:
        - {chain: A, res: 8, comp: CYS, atom: SG, metal_atom: FE1, dist: 2.264}
        - {chain: A, res: 11, comp: CYS, atom: SG, metal_atom: FE2, dist: 2.271}
        - {chain: A, res: 14, comp: CYS, atom: SG, metal_atom: FE3, dist: 2.233}
        - {chain: A, res: 47, comp: CYS, atom: SG, metal_atom: FE4, dist: 2.252}

        - {chain: A, res: 40, comp: CYS, atom: SG, metal_atom: FE2, dist: 2.279}
        - {chain: A, res: 43, comp: CYS, atom: SG, metal_atom: FE3, dist: 2.258}
        - {chain: A, res: 18, comp: CYS, atom: SG, metal_atom: FE4, dist: 2.277}
    site_waters: {}

  heme_myoglobin_5yce:
    pdb: 5YCE
    resolution: 0.77
    xfail: HEM is a metal-containing cofactor; needs an authored block type
    metals:
      - {chain: A, res: 201, comp: HEM}
    donors:
      A/HEM/201:
        - {chain: A, res: 93, comp: HIS, atom: NE2, metal_atom: FE, dist: 2.116}
    site_waters:
      A/HEM/201:
        - {res: 365, dist: 2.110}

  cu_blue_copper_2ov0:
    pdb: 2OV0
    resolution: 0.75
    # type 1 copper: His2Cys trigonal plane, both axial sites open
    metals:
      - {chain: A, res: 307, comp: CU, geometry: trigonal_bipyramidal, n_open_sites: 2}
    donors:
      A/CU/307:
        - {chain: A, res: 53, comp: HIS, atom: ND1, dist: 1.985}
        - {chain: A, res: 92, comp: CYS, atom: SG, dist: 2.168}
        - {chain: A, res: 95, comp: HIS, atom: ND1, dist: 2.045}
    # MET 98 SD sits at 3.07 on an axial site, past the Cu-S cutoff
    site_waters: {}

  mg_one_donor_4e3y:
    pdb: 4E3Y
    resolution: 0.95
    metals:
      - {chain: A, res: 2601, comp: MG, geometry: octahedral, n_open_sites: 5}
      - {chain: B, res: 2301, comp: MG, geometry: octahedral, n_open_sites: 5}

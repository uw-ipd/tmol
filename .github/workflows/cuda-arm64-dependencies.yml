name: CUDA ARM64 dependencies

on:
  pull_request:
    paths:
      - scripts/repair_cuda13_arm64_metadata.py
      - scripts/test_package_install.py
      - scripts/release_matrix.py
      - .github/workflows/cuda-arm64-dependencies.yml
      - .github/workflows/publish.yml
      - .github/workflows/_test_wheel.yml
  workflow_dispatch:

jobs:
  check:
    name: "PyTorch ${{ matrix.torch }} / cuSPARSELt ${{ matrix.cusparselt }} ARM64"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { torch: "2.10.0", cuda: cu130, cusparselt: "0.8.0" }
          - { torch: "2.14.1", cuda: cu132, cusparselt: "0.8.1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PyTorch dependencies in a fresh environment
        run: |
          python -m venv /tmp/torch-check
          /tmp/torch-check/bin/python -m pip install --upgrade pip
          /tmp/torch-check/bin/python -m pip install 'torch==${{ matrix.torch }}' \
            --index-url 'https://download.pytorch.org/whl/${{ matrix.cuda }}'
      - name: Verify metadata repair, all dependencies and native loading
        run: |
          /tmp/torch-check/bin/python -I scripts/repair_cuda13_arm64_metadata.py
          /tmp/torch-check/bin/python -m pip check
          /tmp/torch-check/bin/python -I -c 'import torch; from importlib.metadata import version; assert version("nvidia-cusparselt-cu13") == "${{ matrix.cusparselt }}"; assert torch.__version__.split("+")[0] == "${{ matrix.torch }}"; print(torch.__version__, torch.version.cuda, torch.ones(2).sum().item())'

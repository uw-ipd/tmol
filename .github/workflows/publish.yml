# Publish CUDA/CPU variants to GitHub and standard CPU wheels plus source to PyPI.
#
# Tag pushes build and publish. Manual runs use current CI tools to build the
# immutable tag, or validate existing candidates when a run ID is supplied.
#
# Separate build and upload jobs let you re-run only the upload if it fails,
# without rebuilding wheels or the sdist.

name: Publish Release Artifacts

permissions:
  contents: read
  actions: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable tag to build or recover (for example v0.1.62)
        required: true
        type: string
      candidate-run-id:
        description: Original tag run with complete candidates; leave empty for a fresh build
        required: false
        type: string
      validate-only:
        description: Run every installation/scoring gate without publishing
        type: boolean
        default: true

jobs:
  verify_release_version:
    name: Verify release tag matches project version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      version: ${{ steps.source.outputs.version }}
      candidate_run_id: ${{ steps.source.outputs.candidate_run_id }}
      build_sha: ${{ steps.source.outputs.build_sha }}
      gpu_matrix: ${{ steps.matrix.outputs.gpu }}
      linux_cpu_matrix: ${{ steps.matrix.outputs.linux_cpu }}
      macos_matrix: ${{ steps.matrix.outputs.macos }}
      test_matrix: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag and candidate provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
          VALIDATE_ONLY: ${{ inputs.validate-only }}
        run: python scripts/verify_release_source.py

      - name: Generate wheel matrices
        id: matrix
        run: |
          {
            echo "gpu=$(python scripts/release_matrix.py gpu)"
            echo "linux_cpu=$(python scripts/release_matrix.py linux-cpu)"
            echo "macos=$(python scripts/release_matrix.py macos)"
            echo "test=$(python scripts/release_matrix.py test)"
          } >> "$GITHUB_OUTPUT"

  # ── GPU wheels ───────────────────────────────────────────────────────
  build_wheels:
    name: "${{ matrix.label }}"
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    strategy:
      fail-fast: false
      # Large bursts of full-architecture CUDA builds repeatedly lost hosted
      # runners. Seven-way fan-out completed the same hosted lanes reliably.
      max-parallel: 7
      matrix: ${{ fromJSON(needs.verify_release_version.outputs.gpu_matrix) }}
    uses: ./.github/workflows/_build_wheel.yml
    with:
      source-ref: ${{ needs.verify_release_version.outputs.build_sha }}
      runs-on: ${{ matrix.runs-on }}
      container-image: ${{ matrix.container-image }}
      torch-version: ${{ matrix.torch-version }}
      torch-package-version: ${{ matrix.torch-package-version }}
      python-version: ${{ matrix.python-version }}
      label: ${{ matrix.label }}
      pip-torch-cuda-url: ${{ matrix.torch-index-url }}
      enable-cuda: ${{ matrix.enable-cuda }}
      cuda-archs: ${{ matrix.cuda-archs || '' }}
      use-manylinux-build: true
      target-arch: ${{ matrix.arch }}

  # ── CPU-only wheel ─────────────────────────────────────────────────
  build_cpu_wheel:
    name: ${{ matrix.label }}
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify_release_version.outputs.linux_cpu_matrix) }}
    uses: ./.github/workflows/_build_wheel.yml
    with:
      source-ref: ${{ needs.verify_release_version.outputs.build_sha }}
      runs-on: ${{ matrix.runs-on }}
      container-image: ${{ matrix.container-image }}
      torch-version: ${{ matrix.torch-version }}
      torch-package-version: ${{ matrix.torch-package-version }}
      python-version: ${{ matrix.python-version }}
      label: ${{ matrix.label }}
      pip-torch-cuda-url: ${{ matrix.torch-index-url }}
      enable-cuda: ${{ matrix.enable-cuda }}
      use-manylinux-build: true
      target-arch: ${{ matrix.arch }}

  # ── Apple Silicon CPU-only wheel ───────────────────────────────────
  build_macos_cpu_wheel:
    name: ${{ matrix.label }}
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify_release_version.outputs.macos_matrix) }}
    uses: ./.github/workflows/_build_macos_wheel.yml
    with:
      source-ref: ${{ needs.verify_release_version.outputs.build_sha }}
      python-version: ${{ matrix.python-version }}
      torch-package-version: ${{ matrix.torch-package-version }}
      label: ${{ matrix.label }}

  build_sdist:
    name: Build and test source distribution
    needs: verify_release_version
    uses: ./.github/workflows/_test_sdist.yml
    with:
      source-ref: ${{ needs.verify_release_version.outputs.build_sha }}
      candidate-run-id: ${{ needs.verify_release_version.outputs.candidate_run_id }}

  test_wheels:
    name: "pip cp${{ matrix.python-tag }} ${{ matrix.local-tag }} ${{ matrix.arch }}"
    needs: [verify_release_version, build_wheels, build_cpu_wheel, build_macos_cpu_wheel]
    if: >-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' ||
           (needs.build_wheels.result == 'success' && needs.build_cpu_wheel.result == 'success' &&
            needs.build_macos_cpu_wheel.result == 'success')) }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.verify_release_version.outputs.test_matrix) }}
    uses: ./.github/workflows/_test_wheel.yml
    with:
      candidate-run-id: ${{ needs.verify_release_version.outputs.candidate_run_id }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      python-tag: ${{ matrix.python-tag }}
      local-tag: ${{ matrix.local-tag }}
      arch: ${{ matrix.arch }}
      torch-package-version: ${{ matrix.torch-package-version }}
      torch-index-url: ${{ matrix.torch-index-url }}
      portability: ${{ matrix.portability || false }}

  test_default_pypi:
    name: Plain pip with default PyPI dependencies
    needs: [verify_release_version, build_cpu_wheel]
    if: >-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' || needs.build_cpu_wheel.result == 'success') }}
    uses: ./.github/workflows/_test_wheel.yml
    with:
      candidate-run-id: ${{ needs.verify_release_version.outputs.candidate_run_id }}
      runs-on: ubuntu-22.04
      python-version: "3.12"
      python-tag: "312"
      local-tag: cputorch2.14
      arch: x86_64
      torch-package-version: "2.14.1"
      default-torch: true

  test_gpu_runtime:
    name: Release wheel scoring on CUDA
    needs: [verify_release_version, build_wheels]
    if: >-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' || needs.build_wheels.result == 'success') }}
    uses: ./.github/workflows/_test_gpu_wheel.yml
    with:
      candidate-run-id: ${{ needs.verify_release_version.outputs.candidate_run_id }}

  upload:
    name: Publish validated GitHub artifacts
    needs: [verify_release_version, test_wheels, test_default_pypi, test_gpu_runtime, build_sdist]
    # Recovery skips rebuilds. Override inherited skip propagation, but require
    # every validation gate to succeed before creating public artifacts.
    if: >-
      ${{ !cancelled() &&
          needs.verify_release_version.result == 'success' &&
          needs.test_wheels.result == 'success' &&
          needs.test_default_pypi.result == 'success' &&
          needs.test_gpu_runtime.result == 'success' &&
          needs.build_sdist.result == 'success' &&
          (github.event_name != 'workflow_dispatch' || !inputs.validate-only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication tools
        run: pip install packaging twine

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          run-id: ${{ needs.verify_release_version.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist/

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels/
          pattern: wheel-*
          run-id: ${{ needs.verify_release_version.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: List all packages
        run: |
          echo "=== sdist ==="
          ls -lh dist/
          echo "=== wheels ==="
          ls -lh wheels/ || echo "(no wheels)"

      - name: Validate release wheel manifest
        run: python scripts/validate_release_manifest.py wheels

      - name: Match artifact versions to the verified immutable tag
        env:
          RELEASE_VERSION: ${{ needs.verify_release_version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          version = os.environ["RELEASE_VERSION"]
          for path in Path("wheels").glob("*.whl"):
              assert parse_wheel_filename(path.name)[1].public == version, path
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(sdists) == 1, sdists
          assert str(parse_sdist_filename(sdists[0].name)[1]) == version, sdists
          PY

      - name: Check PyPI source distribution
        run: |
          python scripts/validate_pypi_sdist.py dist/*.tar.gz
          python -m twine check --strict dist/*.tar.gz

      - name: Prepare PyPI CPU wheels and versioned wheel indexes
        run: |
          python scripts/release_artifacts.py --wheels wheels --sdist dist/*.tar.gz --output prepared
          python -m twine check --strict prepared/pypi/*

      - uses: actions/upload-artifact@v4
        with:
          name: publication
          path: prepared/

      - name: Determine version from sdist filename
        id: version
        run: |
          set -- dist/*.tar.gz
          test "$#" -eq 1
          SDIST=$(basename "$1")
          VERSION=${SDIST#tmol-}
          VERSION=${VERSION%.tar.gz}
          PRERELEASE=$(python -c \
            'from packaging.version import Version; import sys; print(str(Version(sys.argv[1]).is_prerelease).lower())' \
            "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create or get GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            wheels/*.whl
            scripts/repair_cuda13_arm64_metadata.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_indexes:
    name: Publish versioned wheel indexes
    needs: upload
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    # Share the docs deployment lock so neither writer can erase the other.
    concurrency:
      group: docs-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: publication
          path: prepared
      - name: Add indexes while preserving docs and previous releases
        run: |
          mkdir -p gh-pages/wheels
          cp -R prepared/wheels/. gh-pages/wheels/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          keep_files: false
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  publish_pypi:
    name: Publish CPU wheels and source to PyPI
    needs: publish_indexes
    if: ${{ !cancelled() && needs.publish_indexes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: publication
          path: prepared
      - name: Verify wheel pages are publicly available
        run: |
          for page in prepared/wheels/*/*/index.html; do
            relative=${page#prepared/}
            curl --fail --silent --show-error --retry 120 --retry-all-errors --retry-delay 10 \
              "https://uw-ipd.github.io/tmol/${relative}" --output /tmp/index.html
            cmp "$page" /tmp/index.html
          done
      - run: python -m pip install twine
      - name: Upload validated distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing prepared/pypi/*

  verify_public:
    name: Verify public PyPI installation
    needs: [verify_release_version, publish_pypi]
    if: >-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          needs.publish_pypi.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runs-on }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from public PyPI
        env:
          RELEASE_VERSION: ${{ needs.verify_release_version.outputs.version }}
        shell: bash
        run: |
          python -m venv /tmp/tmol-public
          /tmp/tmol-public/bin/pip install --upgrade pip
          if [ "$RUNNER_OS" = Linux ]; then
            /tmp/tmol-public/bin/pip install 'torch==2.14.*' --index-url https://download.pytorch.org/whl/cpu
          fi
          version=$RELEASE_VERSION
          /tmp/tmol-public/bin/pip install --no-cache-dir --only-binary=tmol "tmol==$version" --index-url https://pypi.org/simple
          /tmp/tmol-public/bin/pip check
          /tmp/tmol-public/bin/python -I scripts/smoke_installed_package.py \
            --version "$version" --pdb "$GITHUB_WORKSPACE/tmol/tests/data/pdb/1ubq.pdb"

name: Docs

on:
  # Build previews for stacked PRs as well as PRs targeting the main branch.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master, kdidi/open-pr-cuda-pytorch214-audit]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCS_BASE_URL: https://uw-ipd.github.io/tmol

jobs:
  docs:
    name: build docs
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMOL_DOCS_BASE_URL: https://uw-ipd.github.io/tmol/latest/
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tmol-ccache-v1-linux-x86_64-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            tmol-ccache-v1-linux-x86_64-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-
            tmol-ccache-v1-linux-x86_64-

      - name: build CPU-only package
        env:
          MAX_JOBS: 4
          TMOL_INSTALL_EXTRAS: dev,docs
        run: .github/ci/build_cpu_package.sh

      - name: execute tutorials and build docs
        run: .github/ci/run_docs_cpu_work.sh

      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: tmol-docs-html
          path: docs/_build/html
          if-no-files-found: error

  deploy:
    name: publish docs
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: docs
    runs-on: ubuntu-latest
    concurrency:
      group: docs-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Download rendered docs
        uses: actions/download-artifact@v4
        with:
          name: tmol-docs-html
          path: rendered-docs

      - name: Stage documentation
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TARGET="previews/pr-${PR_NUMBER}"
          else
            TARGET="latest"
            cat > gh-pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=latest/">
              <link rel="canonical" href="https://uw-ipd.github.io/tmol/latest/">
              <title>TMol documentation</title>
              <script>window.location.replace("latest/" + window.location.search + window.location.hash);</script>
            </head>
            <body>
              <p>Continue to the <a href="latest/">latest TMol documentation</a>.</p>
            </body>
          </html>
          HTML
          fi
          mkdir -p "gh-pages/${TARGET}"
          rm -f gh-pages/CNAME
          rsync -av --delete rendered-docs/ "gh-pages/${TARGET}/"
          echo "Docs: ${DOCS_BASE_URL}/${TARGET}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          keep_files: false
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

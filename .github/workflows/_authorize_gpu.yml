name: ~Authorize GPU scheduling

on:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ""
      ref:
        type: string
        default: ""
      allow-release:
        type: boolean
        default: false
    outputs:
      sha:
        value: ${{ jobs.authorize.outputs.sha }}
      attempt:
        value: ${{ jobs.authorize.outputs.attempt }}

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      attempt: ${{ steps.authorize.outputs.attempt }}
    steps:
      # Never execute the proposed PR's authorization code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GPU_PR: ${{ inputs.pr }}
          GPU_REF: ${{ inputs.ref }}
          GPU_ALLOW_RELEASE: ${{ inputs.allow-release }}
        run: python .github/scripts/authorize_gpu.py

name: Wheel smoke test

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - CMakeLists.txt
      - pyproject.toml
      - packages/**
      - tmol/**
      - scripts/**
      - .github/workflows/**
      - .github/ci/**

concurrency:
  group: wheel-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
      test: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          args=()
          if [ "${{ github.event_name }}" = pull_request ]; then args+=(--smoke); fi
          for matrix in linux macos test; do
            echo "$matrix=$(python scripts/release_matrix.py "$matrix" "${args[@]}")" >> "$GITHUB_OUTPUT"
          done

  test-sdist:
    uses: ./.github/workflows/_test_sdist.yml

  build:
    name: ${{ matrix.label }}
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.matrix.outputs.linux) }}
    uses: ./.github/workflows/_build_wheel.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      container-image: ${{ matrix.container-image }}
      torch-version: ${{ matrix.torch-version }}
      torch-package-version: ${{ matrix.torch-package-version }}
      python-version: ${{ matrix.python-version }}
      label: ${{ matrix.label }}
      pip-torch-cuda-url: ${{ matrix.torch-index-url }}
      enable-cuda: ${{ matrix.enable-cuda }}
      cuda-version: ${{ matrix.cuda-version }}
      cuda-archs: ${{ matrix.cuda-archs }}
      use-manylinux-build: true
      target-arch: ${{ matrix.arch }}

  build-macos:
    name: ${{ matrix.label }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.macos) }}
    uses: ./.github/workflows/_build_macos_wheel.yml
    with:
      python-version: ${{ matrix.python-version }}
      torch-package-version: ${{ matrix.torch-package-version }}
      label: ${{ matrix.label }}

  test:
    name: "${{ matrix.label }} / Torch ${{ matrix.torch-package-version }}"
    needs: [matrix, build, build-macos]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.test) }}
    uses: ./.github/workflows/_test_wheel.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      python-tag: ${{ matrix.python-tag }}
      local-tag: ${{ matrix.local-tag }}
      arch: ${{ matrix.arch }}
      torch-package-version: ${{ matrix.torch-package-version }}
      torch-index-url: ${{ matrix.torch-index-url }}
      portability: ${{ matrix.portability }}

  test-default-pypi:
    needs: build
    uses: ./.github/workflows/_test_wheel.yml
    with:
      runs-on: ubuntu-22.04
      python-version: "3.12"
      python-tag: "312"
      local-tag: cpu
      arch: x86_64
      torch-package-version: "2.14.1"
      default-torch: true

  test-gpu:
    needs: build
    uses: ./.github/workflows/_test_gpu_wheel.yml

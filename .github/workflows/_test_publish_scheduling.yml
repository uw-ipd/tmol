# Generated by scripts/test_publish_scheduling.py --write-fixture.
# No secrets or publication commands; only the real scheduling graph.
name: Release scheduling fixture (no uploads)
'on':
  workflow_call:
    inputs:
      trigger:
        type: string
        required: true
      recovery:
        type: boolean
        required: true
      validate-only:
        type: boolean
        required: true
      skip-gate:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  verify_release_version:
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
    outputs:
      candidate_run_id: ${{ inputs.recovery && 'original' || '' }}
  build_wheels:
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  build_cpu_wheel:
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  build_macos_cpu_wheel:
    needs: verify_release_version
    if: needs.verify_release_version.outputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  build_sdist:
    needs: verify_release_version
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  test_wheels:
    needs:
    - verify_release_version
    - build_wheels
    - build_cpu_wheel
    - build_macos_cpu_wheel
    if: |-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' ||
           (needs.build_wheels.result == 'success' && needs.build_cpu_wheel.result == 'success' &&
            needs.build_macos_cpu_wheel.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  test_default_pypi:
    needs:
    - verify_release_version
    - build_cpu_wheel
    if: |-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' || needs.build_cpu_wheel.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  test_gpu_runtime:
    needs:
    - verify_release_version
    - build_wheels
    if: |-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          (needs.verify_release_version.outputs.candidate_run_id != '' || needs.build_wheels.result == 'success') && !inputs.skip-gate }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  upload:
    needs:
    - verify_release_version
    - test_wheels
    - test_default_pypi
    - test_gpu_runtime
    - build_sdist
    if: |-
      ${{ !cancelled() &&
          needs.verify_release_version.result == 'success' &&
          needs.test_wheels.result == 'success' &&
          needs.test_default_pypi.result == 'success' &&
          needs.test_gpu_runtime.result == 'success' &&
          needs.build_sdist.result == 'success' &&
          (inputs.trigger != 'workflow_dispatch' || !inputs.validate-only) }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  publish_indexes:
    needs: upload
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  publish_pypi:
    needs: publish_indexes
    if: ${{ !cancelled() && needs.publish_indexes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  verify_public:
    needs:
    - verify_release_version
    - publish_pypi
    if: |-
      ${{ !cancelled() && needs.verify_release_version.result == 'success' &&
          needs.publish_pypi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - run: 'true'
  assert_scheduling:
    needs:
    - verify_release_version
    - build_wheels
    - build_cpu_wheel
    - build_macos_cpu_wheel
    - build_sdist
    - test_wheels
    - test_default_pypi
    - test_gpu_runtime
    - upload
    - publish_indexes
    - publish_pypi
    - verify_public
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
      NO_PUBLISH: ${{ inputs.validate-only || inputs.skip-gate }}
    steps:
    - name: Assert every publication stage ran or was blocked
      run: |
        python - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        expected = 'skipped' if os.environ['NO_PUBLISH'] == 'true' else 'success'
        for job in ('upload', 'publish_indexes', 'publish_pypi', 'verify_public'):
            actual = results[job]['result']
            assert actual == expected, (job, actual, expected)
        print(json.dumps(results, indent=2))
        PY

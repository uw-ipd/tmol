# CI uses independent hosted CPU and self-hosted GPU lanes. Keeping CPU work off
# the scarce GPU runner gives quick feedback even while DIGS is busy.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # Validate intermediate stack branches as well as changes targeting master.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  packaging:
    name: pip resolver and release metadata
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest packaging build scikit-build-core pyyaml 'cmake>=3.24,<4' ninja
      - name: Test index installs, ABI constraints, hashes and source metadata
        run: python -m pytest -o addopts= scripts/test_release_artifacts.py scripts/test_release_matrix.py scripts/test_release_wheel_version.py scripts/test_pypi_sdist.py .github/scripts/test_colab_release_config.py -v

  cpu:
    name: pytest (cpu, ${{ matrix.platform }})
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
            build_workers: 4
            # a hosted runner gives 16 GB, and each worker holds its own poses:
            # six of them run out where four finish the suite with room to spare
            test_workers: 4
          - platform: linux-aarch64
            runs-on: ubuntu-24.04-arm
            build_workers: 4
            test_workers: 4
          - platform: macos-arm64
            runs-on: macos-15
            build_workers: 2
            test_workers: 2
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install compiler cache
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tmol-ccache-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            tmol-ccache-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-
            tmol-ccache-v1-${{ matrix.platform }}-

      - name: build CPU-only package
        env:
          MAX_JOBS: ${{ matrix.build_workers }}
        run: .github/ci/build_cpu_package.sh

      - name: compile representative CPU JIT extension
        if: matrix.platform == 'linux-x86_64'
        env:
          MAX_JOBS: ${{ matrix.build_workers }}
          TMOL_USE_JIT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import torch
          from tmol.kinematics.compiled import forward_kin_op

          assert torch.version.cuda is None
          print("loaded", forward_kin_op, "with torch", torch.__version__)
          PY

      - name: report compiler cache
        if: always()
        run: ccache --show-stats

      - name: test
        env:
          CPU_PYTEST_WORKERS: ${{ matrix.test_workers }}
        run: .github/ci/run_cpu_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cpu-${{ matrix.platform }}
          path: |
            testing.cpu.junit.xml
            coverage.cpu.xml
          if-no-files-found: ignore

      - uses: test-summary/action@v2
        if: always() && hashFiles('testing.cpu.junit.xml') != ''
        with:
          paths: testing.cpu.junit.xml

  gpu:
    name: pytest (cuda)
    if: github.event.action != 'closed'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 720
    needs: lint
    env:
      SIF: /home/bench/git_ci_apptainer/tmol.sif
      SLURM_PARTITION: gpu-train
      SLURM_GRES: gpu:1
      SLURM_CPUS_PER_TASK: 16
      SLURM_MEM: 128G
      SLURM_TIME: 06:00:00
      # Exclude nodes with known uncorrectable ECC faults until repaired.
      SLURM_EXCLUDE: g2543,g2547,g2548
      SRUN_GPU_MAX_ATTEMPTS: 5
      SRUN_GPU_RETRY_SLEEP: 10
      # PR tests need only the architecture of the allocated DIGS GPU.
      TMOL_CI_CUDA_ARCHITECTURES: native
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - run: .github/ci/restore_source_timestamps.sh
      - run: .github/ci/setup_ci_venv.sh

      - name: build and test
        env:
          GPU_ALLOC_SENTINEL: ${{ github.workspace }}/.gpu_alloc_started
        run: |
          rm -f "$GPU_ALLOC_SENTINEL"
          .github/ci/srun_gpu_retry.sh <<SCRIPT
          .github/ci/exec_gpu_apptainer.sh .github/ci/run_ci_gpu_work.sh
          SCRIPT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cuda
          path: |
            testing.cuda.junit.xml
            coverage.cuda.xml
          if-no-files-found: ignore

      - uses: test-summary/action@v2
        if: always()
        with:
          paths: testing.cuda.junit.xml

  coverage:
    name: Upload coverage reports
    needs: [cpu, gpu]
    if: always() && !cancelled() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: test-results-cpu-linux-x86_64
          path: reports/cpu
      - uses: actions/download-artifact@v4
        with:
          name: test-results-cuda
          path: reports/cuda
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/cpu/coverage.cpu.xml
          flags: cpu
          use_pypi: true
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v5
        if: always() && hashFiles('reports/cuda/coverage.cuda.xml') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/cuda/coverage.cuda.xml
          flags: cuda
          use_pypi: true
          fail_ci_if_error: true

  # Coverage uploads have their own visible status. Service/network failures
  # can be retried without rerunning successful CPU and GPU test suites.
  # The historical ci check still requires every runtime and packaging lane.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always() && !cancelled() && github.event.action != 'closed'
    needs: [lint, packaging, cpu, gpu]
    steps:
      - name: require every CI lane
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.packaging.result }}" = success
          test "${{ needs.cpu.result }}" = success
          test "${{ needs.gpu.result }}" = success

# CI uses independent hosted CPU and self-hosted GPU lanes. Keeping CPU work off
# the scarce GPU runner gives quick feedback even while DIGS is busy.

name: CI

on:
  push:
    branches: [master, "kdidi/**"]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  cpu:
    name: pytest (cpu, ${{ matrix.platform }})
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
            build_workers: 4
            test_workers: 6
          - platform: linux-aarch64
            runs-on: ubuntu-24.04-arm
            build_workers: 4
            test_workers: 4
          - platform: macos-arm64
            runs-on: macos-15
            build_workers: 2
            test_workers: 2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build CPU-only package
        env:
          MAX_JOBS: ${{ matrix.build_workers }}
        run: .github/ci/build_cpu_package.sh

      - name: test
        env:
          CPU_PYTEST_WORKERS: ${{ matrix.test_workers }}
        run: .github/ci/run_cpu_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cpu-${{ matrix.platform }}
          path: |
            testing.cpu.junit.xml
            coverage.cpu.xml
          if-no-files-found: ignore

      - uses: test-summary/action@v2
        if: always() && hashFiles('testing.cpu.junit.xml') != ''
        with:
          paths: testing.cpu.junit.xml

      - uses: codecov/codecov-action@v5
        if: always() && matrix.platform == 'linux-x86_64'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.cpu.xml
          flags: cpu
          fail_ci_if_error: true

  gpu:
    name: pytest (cuda)
    if: github.event.action != 'closed'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 720
    needs: lint
    env:
      SIF: /home/bench/git_ci_apptainer/tmol.sif
      SLURM_PARTITION: gpu-train
      SLURM_GRES: gpu:1
      SLURM_CPUS_PER_TASK: 16
      SLURM_MEM: 128G
      SLURM_TIME: 06:00:00
      # Exclude the node with a known uncorrectable ECC fault until repaired.
      SLURM_EXCLUDE: g2548
      SRUN_GPU_MAX_ATTEMPTS: 5
      SRUN_GPU_RETRY_SLEEP: 10
      # PR tests need only the architecture of the allocated DIGS GPU.
      TMOL_CI_CUDA_ARCHITECTURES: native
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - run: .github/ci/restore_source_timestamps.sh
      - run: .github/ci/setup_ci_venv.sh

      - name: build and test
        env:
          GPU_ALLOC_SENTINEL: ${{ github.workspace }}/.gpu_alloc_started
        run: |
          rm -f "$GPU_ALLOC_SENTINEL"
          .github/ci/srun_gpu_retry.sh <<SCRIPT
          .github/ci/exec_gpu_apptainer.sh .github/ci/run_ci_gpu_work.sh
          SCRIPT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cuda
          path: |
            testing.cuda.junit.xml
            coverage.cuda.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark/**/*
          if-no-files-found: ignore

      - uses: test-summary/action@v2
        if: always()
        with:
          paths: testing.cuda.junit.xml

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.cuda.xml
          flags: cuda
          fail_ci_if_error: true

  # Preserve the historical required-check name while the work executes in
  # parallel jobs.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always() && github.event.action != 'closed'
    needs: [lint, cpu, gpu]
    steps:
      - name: require every CI lane
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.cpu.result }}" = success
          test "${{ needs.gpu.result }}" = success

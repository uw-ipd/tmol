# Automatic hosted CPU checks. Maintainers dispatch GPU CI separately.

name: CPU CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # Validate intermediate stack branches as well as changes targeting main.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  packaging:
    name: pip resolver and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest packaging build scikit-build-core pyyaml 'cmake>=3.24,<4' ninja
      - name: Test index installs, ABI constraints, hashes and source metadata
        run: python -m pytest -o addopts= scripts/test_release_artifacts.py scripts/test_release_matrix.py scripts/test_native_packages.py scripts/test_pypi_sdist.py scripts/test_cuda13_arm64_metadata.py scripts/test_release_source.py scripts/test_publish_scheduling.py .github/scripts/test_authorize_gpu.py scripts/test_compare_benchmark.py .github/scripts/test_colab_release_config.py -v

  cpu:
    name: pytest (cpu, ${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
            build_workers: 4
            # a hosted runner gives 16 GB, and each worker holds its own poses:
            # six of them run out where four finish the suite with room to spare
            test_workers: 4
          - platform: linux-aarch64
            runs-on: ubuntu-24.04-arm
            build_workers: 4
            test_workers: 4
          - platform: macos-arm64
            runs-on: macos-15
            build_workers: 2
            test_workers: 2
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install compiler cache
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi

      - name: restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tmol-ccache-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            tmol-ccache-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml', 'cmake/**') }}-
            tmol-ccache-v1-${{ matrix.platform }}-

      - name: build CPU-only package
        env:
          MAX_JOBS: ${{ matrix.build_workers }}
        run: .github/ci/build_cpu_package.sh

      - name: compile representative CPU JIT extension
        if: matrix.platform == 'linux-x86_64'
        env:
          MAX_JOBS: ${{ matrix.build_workers }}
          TMOL_USE_JIT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import torch
          from tmol.kinematics.compiled import forward_kin_op

          assert torch.version.cuda is None
          print("loaded", forward_kin_op, "with torch", torch.__version__)
          PY

      - name: report compiler cache
        if: always()
        run: ccache --show-stats

      - name: test
        env:
          CPU_PYTEST_WORKERS: ${{ matrix.test_workers }}
        run: .github/ci/run_cpu_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cpu-${{ matrix.platform }}
          path: |
            testing.cpu.junit.xml
            coverage.cpu.xml
          if-no-files-found: ignore

      - uses: test-summary/action@v2
        if: always() && hashFiles('testing.cpu.junit.xml') != ''
        with:
          paths: testing.cpu.junit.xml

      - name: Upload CPU coverage
        if: matrix.platform == 'linux-x86_64' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.cpu.xml
          flags: cpu
          use_pypi: true
          # Coverage reporting is optional; tests and their artifact remain required.
          fail_ci_if_error: false

  # One required status for all automatic checks; GPU CI reports separately.
  ci:
    name: ci (CPU)
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs: [lint, packaging, cpu]
    steps:
      - name: require every automatic CPU lane
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.packaging.result }}" = success
          test "${{ needs.cpu.result }}" = success

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        args: ['-i']
        files: \.(c|cc|cpp|h|hh|cu|cuh)$
        exclude: >
            (?x)^(
                tmol/extern/.* |
                dev/.* 
            )$
  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        exclude: >
            (?x)^(
                tmol/extern/.* |
                tmol/ligand/external/.* |
                dev/.* |
                \.conda/.*
            )$
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        exclude: >
            (?x)^(
                tmol/extern/.* |
                tmol/ligand/external/.* |
                dev/.* |
                \.venv/.*
            )$

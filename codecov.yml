# Codecov configuration.
#
# The OpenBabel compatibility layer and the offline fixture-generation script
# are excluded from coverage reporting.
# Keep this list in sync with `[tool.coverage.run] omit` in pyproject.toml.
ignore:
  - "tmol/ligand/_openbabel_compat.py"
  - "tmol/tests/ligand/_build_pli_ligand_cifs.py"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

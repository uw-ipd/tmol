[build-system]
requires = ["setuptools>=77", "wheel", "jax>=0.11.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tmol-jax-cuda"
dynamic = ["version", "dependencies"]
description = "Optional CUDA pair-scoring kernels for tmol-jax"
license = "Apache-2.0"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/uw-ipd/tmol"
Documentation = "https://uw-ipd.github.io/tmol/"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["tmol_jax_cuda"]
